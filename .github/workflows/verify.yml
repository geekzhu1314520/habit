name: Verify launch candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        walking: ['false', 'true']
    env:
      # Exercise configurable origins so hard-coded default ports fail in CI.
      HABIT_TEST_PORT: '5187'
      VITE_WALKING_ENABLED: ${{ matrix.walking }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: npm
      - run: npm install --global npm@11.5.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm run typecheck && npm run lint && npm run test -- --run --coverage && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
